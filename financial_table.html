<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÁO CÁO TÀI CHÍNH ĐA QUỐC GIA</title>
</head>
<body>
    <h1>BÁO CÁO TÀI CHÍNH ĐA QUỐC GIA</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Khu vực</th>
                <th rowspan="2">Hạng mục</th>
                <th colspan="3">Quý I</th>
            </tr>
            <tr>
                <th>Tháng 1</th>
                <th>Tháng 2</th>
                <th>Tháng 3</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Châu Á</th>
                <td>Phần cứng</td>
                <td>$500</td>
                <td>$600</td>
                <td>$550</td>
            </tr>
            <tr>
                <td>Phần mềm</td>
                <td>$1,000</td>
                <td>$1,200</td>
                <td>$1,100</td>
            </tr>
            <tr>
                <th>Châu Âu</th>
                <td>Phần mềm</td>
                <td>$800</td>
                <td>$900</td>
                <td>$950</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">Tổng toàn cầu</th>
                <td>$2,300</td>
                <td>$2,700</td>
                <td>$2,600</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
